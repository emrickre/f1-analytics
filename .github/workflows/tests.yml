name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — минимальная версия для деплоя на сервер
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install dependencies
        run: pip install -r requirements-live.txt
      - name: Run tests
        run: python -m unittest -v tests.test_live

  analysis:
    name: Analysis (pandas / statsmodels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-live.txt
            requirements-analysis.txt
      - name: Install dependencies
        run: pip install -r requirements-live.txt -r requirements-analysis.txt
      - name: Run analysis tests
        run: python -m unittest -v tests.test_analysis

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app.js
        run: node --check live/static/app.js
